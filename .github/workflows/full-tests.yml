name: Full tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [trunk, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="$AUTH_HEADER" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Run all unit tests and record duration
        shell: bash
        run: |
          start=$(date +%s)
          ./gradlew test
          elapsed=$(( $(date +%s) - start ))
          echo "Full unit test duration: ${elapsed}s"
