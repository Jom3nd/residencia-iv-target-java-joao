name: Selective tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [trunk, main]

permissions:
  contents: read

jobs:
  selective:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="$AUTH_HEADER" fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*" "+refs/pull/*/merge:refs/remotes/pull/*/merge"
          git checkout --detach "$GITHUB_SHA"

      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Prepare mold-repo and Gradle wrapper shim
        run: |
          git clone --depth 1 https://github.com/residencia-iv-test/mold-repo.git "$RUNNER_TEMP/mold-repo"
          mkdir -p "$RUNNER_TEMP/gradle-bin"
          printf '#!/usr/bin/env bash\nexec "%s/gradlew" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/gradle-bin/gradle"
          chmod +x "$RUNNER_TEMP/gradle-bin/gradle"
          echo "$RUNNER_TEMP/gradle-bin" >> "$GITHUB_PATH"

      - name: Run selective tests and record duration
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BASE_SHA" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BASE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi
          start=$(date +%s)
          bash "$RUNNER_TEMP/mold-repo/run.sh" --base "$base" --root "$GITHUB_WORKSPACE"
          elapsed=$(( $(date +%s) - start ))
          echo "Selective test duration: ${elapsed}s"
